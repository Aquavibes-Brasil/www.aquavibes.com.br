<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poseidon · Boas-vindas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* fundo escuro com degradê marinho */
        .bg-poseidon {
            background: radial-gradient(circle at 30% 40%, #0b2a3b, #041016);
        }
        /* animação suave na logo */
        .logo-pulse {
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.2)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 30px rgba(0, 200, 255, 0.5)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.2)); }
        }
        .float-soft {
            animation: floatY 4s ease-in-out infinite;
        }
        @keyframes floatY {
            0% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0); }
        }
        /* vidro fosco no card */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .border-cyan-soft {
            border-color: rgba(34, 211, 238, 0.15);
        }
        .hover-border-glow:hover {
            border-color: rgba(34, 211, 238, 0.4);
            box-shadow: 0 0 30px -8px rgba(0, 180, 255, 0.15);
        }
        .text-glow-cyan {
            text-shadow: 0 0 20px rgba(0, 180, 255, 0.2);
        }
        .fade-in {
            opacity: 0;
            animation: fadeUp 0.7s ease forwards;
        }
        .fade-d1 { animation-delay: 0.1s; }
        .fade-d2 { animation-delay: 0.25s; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-poseidon flex items-center justify-center p-5 font-sans antialiased">

    <!-- Container principal -->
    <div class="w-full max-w-md mx-auto">

        <!-- Card central com vidro e leve brilho -->
        <div class="glass-card rounded-3xl shadow-2xl p-8 sm:p-10 text-center border border-cyan-soft hover-border-glow transition-all duration-500">

            <!-- Logo com animações -->
            <div class="flex justify-center mb-6 logo-pulse float-soft">
                <img 
                    src="Poseidon_logo_sem_fundo.png" 
                    alt="Poseidon" 
                    class="h-28 sm:h-36 w-auto object-contain drop-shadow-2xl"
                    onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%230b2a3b%22 stroke=%22%2322d3ee%22 stroke-width=%222%22/%3E%3Cpath d=%22M30 40 L45 30 L60 40 L75 30 L70 55 L55 65 L40 55 L25 65 L30 40%22 fill=%22%2322d3ee%22 opacity=%220.8%22/%3E%3C/svg%3E';"
                />
            </div>

            <!-- Título minimalista -->
            <h1 class="text-3xl sm:text-4xl font-light text-white tracking-wide fade-in fade-d1">
                <span class="font-medium text-cyan-300 text-glow-cyan">Poseidon</span>
            </h1>

            <!-- Subtítulo discreto -->
            <p class="text-slate-400 text-sm sm:text-base mt-1 fade-in fade-d2">
                <i class="fas fa-water text-cyan-400/70 mr-1"></i> AquaVibes
            </p>

            <!-- Linha decorativa -->
            <div class="w-16 h-0.5 bg-gradient-to-r from-cyan-400/60 to-transparent mx-auto my-5 rounded-full fade-in fade-d2"></div>

            <!-- rodapé limpo apenas com linha sutil -->
            <div class="mt-8 pt-4 border-t border-slate-700/40"></div>
        </div>
    </div>

</body>
</html>
