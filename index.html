<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquavibes | Bem-vindo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c4a6e 0%, #0891b2 50%, #22d3ee 100%);
            font-family: 'Segoe UI', 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Efeitos de ondas no fundo */
        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: waveMove 12s linear infinite;
            pointer-events: none;
        }

        body::after {
            animation-delay: -6s;
            opacity: 0.5;
        }

        @keyframes waveMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(5deg); }
            50% { transform: translate(0, 10%) rotate(0deg); }
            75% { transform: translate(-5%, 5%) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 90%;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2.5rem;
        }

        /* Brilho ao redor da imagem */
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
            filter: blur(30px);
            z-index: -1;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }

        .imagem-central {
            max-width: 380px;
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.25);
            animation: fadeInUp 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: clamp(2.8rem, 7vw, 4.5rem);
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.18em;
            margin-bottom: 0.8rem;
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            animation-delay: 0.3s;
            text-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .slogan {
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-weight: 300;
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            animation-delay: 0.6s;
            margin-bottom: 3rem;
        }

        .botao-acao {
            display: inline-block;
            padding: 1rem 3rem;
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 50px;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-decoration: none;
            transition: all 0.4s ease;
            backdrop-filter: blur(12px);
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            animation-delay: 0.9s;
        }

        .botao-acao:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .imagem-central {
                max-width: 280px;
            }
            h1 {
                letter-spacing: 0.12em;
            }
            .slogan {
                letter-spacing: 0.15em;
            }
        }

        @media (max-width: 480px) {
            .imagem-central {
                max-width: 220px;
            }
            .container {
                padding: 1rem;
            }
            .botao-acao {
                padding: 0.85rem 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-wrapper">
            <!-- Substitua o valor de src pelo caminho/nome da sua imagem -->
            <img src="aquavibes-logo.png" alt="Aquavibes" class="imagem-central">
        </div>

        <h1>AQUAVIBES</h1>
        <p class="slogan">Onde a tecnologia se une a natureza</p>

        <a href="#" class="botao-acao">ENTRAR NO SITE</a>
    </div>

</body>
</html>
