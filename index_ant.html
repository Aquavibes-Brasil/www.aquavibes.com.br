<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Aquavibes | Bem-vindo</title>
    <style>
        /* RESET E BASE COMPATÍVEL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0c4a6e 0%, #0891b2 50%, #22d3ee 100%);
            font-family: 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Montserrat', sans-serif;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* EFEITOS DE ONDAS NO FUNDO */
        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: waveMove 12s linear infinite;
            pointer-events: none;
        }

        body::after {
            animation-delay: -6s;
            opacity: 0.5;
        }

        @keyframes waveMove {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 5%) rotate(5deg); }
            50% { transform: translate(0, 10%) rotate(0deg); }
            75% { transform: translate(-5%, 5%) rotate(-5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* MENU DE NAVEGAÇÃO SUPERIOR */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 1rem;
            z-index: 100;
            animation: fadeInDown 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(-20px);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.8rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .menu a {
            color: rgba(255, 255, 255, 0.92);
            text-decoration: none;
            font-size: 0.92rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0.5rem 0;
            position: relative;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .menu a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: #fff;
            transition: width 0.3s ease;
        }

        .menu a:hover {
            color: #ffffff;
        }

        .menu a:hover::after {
            width: 100%;
        }

        @keyframes fadeInDown {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CONTEÚDO PRINCIPAL */
        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 1.5rem;
            max-width: 95%;
            width: 100%;
            margin-top: 5rem;
        }

        .logo-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 2.5rem;
        }

        /* BRILHO AO REDOR DA IMAGEM */
        .logo-wrapper::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
            filter: blur(30px);
            z-index: -1;
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
        }

        .imagem-central {
            max-width: 300px;
            width: 80%;
            height: auto;
            border-radius: 20px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.18),
                0 0 0 1px rgba(255, 255, 255, 0.25);
            animation: fadeInUp 1.2s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            color: #ffffff;
            font-weight: 700;
            letter-spacing: 0.18em;
            margin-bottom: 0.8rem;
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            text-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .slogan {
            font-size: clamp(0.95rem, 2.2vw, 1.3rem);
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.25em;
            text-transform: uppercase;
            font-weight: 300;
            animation: fadeInUp 1.5s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
            animation-delay: 0.3s;
            line-height: 1.6;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===================================== */
        /* REGRAS DE RESPONSIVIDADE POR TELA     */
        /* ===================================== */

        /* TABLETS e TELAS MÉDIAS */
        @media (max-width: 900px) {
            .menu {
                gap: 1.4rem;
            }
            .menu a {
                font-size: 0.88rem;
            }
            .imagem-central {
                max-width: 300px;
            }
            h1 {
                letter-spacing: 0.14em;
            }
        }

        /* CELULARES GRANDES */
        @media (max-width: 600px) {
            nav {
                padding: 1rem 0.8rem;
            }
            .menu {
                gap: 0.9rem 1.2rem;
            }
            .menu a {
                font-size: 0.82rem;
            }
            .imagem-central {
                max-width: 260px;
            }
            .container {
                margin-top: 6rem;
                padding: 1rem;
            }
            h1 {
                letter-spacing: 0.1em;
            }
            .slogan {
                letter-spacing: 0.15em;
            }
        }

        /* CELULARES PEQUENOS */
        @media (max-width: 400px) {
            .menu {
                gap: 0.7rem 1rem;
            }
            .menu a {
                font-size: 0.76rem;
            }
            .imagem-central {
                max-width: 200px;
            }
            h1 {
                font-size: clamp(1.8rem, 5vw, 2.5rem);
            }
        }

        /* TELAS MUITO GRANDES / 4K */
        @media (min-width: 1400px) {
            .imagem-central {
                max-width: 450px;
            }
            .menu {
                gap: 3rem;
            }
            .menu a {
                font-size: 1rem;
            }
        }

        /* ORIENTAÇÃO PAISAGEM EM CELULAR */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                margin-top: 2rem;
                padding: 0.5rem;
            }
            .logo-wrapper {
                margin-bottom: 1rem;
            }
            .imagem-central {
                max-width: 180px;
            }
            h1 {
                font-size: 1.8rem;
                margin-bottom: 0.3rem;
            }
            .slogan {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Menu de Navegação Superior -->
    <nav>
        <ul class="menu">
            <li><a href="PAINEL_CLIENTES.html">Entrar</a></li>
            <li><a href="#suporte">Suporte</a></li>
            <li><a href="#revendedor">Revendedor</a></li>
            <li><a href="#informacoes">Informações</a></li>
            <li><a href="#contatos">Contatos</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="logo-wrapper">
            <img src="logo1.png" alt="Aquavibes" class="imagem-central">
        </div>

        <h1>AQUAVIBES</h1>
        <p class="slogan">Onde a tecnologia se une à natureza</p>
    </div>

</body>
</html>
