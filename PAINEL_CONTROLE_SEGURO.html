<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaVibes - Painel de Monitoramento</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aqua: '#0077be',
                        online: '#10b981',
                        offline: '#ef4444',
                        new24h: '#f59e0b',
                        newMonth: '#8b5cf6',
                        visits: '#3b82f6'
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-shadow {
                box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            }
            .pulse {
                animation: pulse 2s infinite;
            }
            @keyframes pulse {
                0% { opacity: 0.6; }
                50% { opacity: 1; }
                100% { opacity: 0.6; }
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
    <!-- Elemento de áudio oculto -->
    <audio id="somNotificacao" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJN0F/A8f9NIEeQAAA==" type="audio/wav">
    

    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <header class="bg-aqua text-white rounded-xl p-6 mb-8 card-shadow">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <span class="bg-white/20 px-3 py-1 rounded-full text-sm font-semibold">V1.0</span>
                    <i class="fa fa-tint text-4xl"></i>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold">AquaVibes</h1>
                        <p class="opacity-90">Painel de Gerenciamento de Dispositivos</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-sm opacity-90">Última verificação:</p>
                    <p id="horaAtualizacao" class="font-semibold">--:--:--</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-5 mb-8">
            <div class="bg-white rounded-xl p-5 card-shadow border-l-4 border-aqua">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm">Total Cadastrados</p>
                        <h2 id="totalCadastrados" class="text-3xl font-bold text-aqua mt-1">0</h2>
                    </div>
                    <i class="fa fa-database text-4xl text-aqua/20"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-5 card-shadow border-l-4 border-online">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm">Dispositivos Online</p>
                        <h2 id="totalOnline" class="text-3xl font-bold text-online mt-1">0</h2>
                    </div>
                    <i class="fa fa-wifi text-4xl text-online/20"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-5 card-shadow border-l-4 border-new24h">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm">Adicionados (Últimas 24h)</p>
                        <h2 id="adicionados24h" class="text-3xl font-bold text-new24h mt-1">0</h2>
                    </div>
                    <i class="fa fa-calendar-day text-4xl text-new24h/20"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-5 card-shadow border-l-4 border-newMonth">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm">Adicionados (Último Mês)</p>
                        <h2 id="adicionadosMes" class="text-3xl font-bold text-newMonth mt-1">0</h2>
                    </div>
                    <i class="fa fa-calendar-month text-4xl text-newMonth/20"></i>
                </div>
            </div>
            <div class="bg-white rounded-xl p-5 card-shadow border-l-4 border-visits">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-gray-500 text-sm">Total de Visitas</p>
                        <h2 id="totalVisitas" class="text-3xl font-bold text-visits mt-1">0</h2>
                    </div>
                    <i class="fa fa-eye text-4xl text-visits/20"></i>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl p-6 card-shadow">
            <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fa fa-list text-aqua"></i> Lista de Dispositivos
            </h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                        <tr class="bg-gray-100 text-left">
                            <th class="p-3 rounded-l-lg">ID do Dispositivo</th>
                            <th class="p-3">Endereço MAC</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaDispositivos" class="divide-y divide-gray-200">
                        <tr>
                            <td colspan="3" class="p-5 text-center text-gray-500">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <footer class="mt-8 text-center text-gray-500 text-sm">
            <p>AquaVibes © 2026 | Sistema de Monitoramento</p>
        </footer>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDV6RsVkCORj9krfMKwHxvAcZ1KuLE63Uk",
            databaseURL: "https://aquavibes-4c90b-default-rtdb.firebaseio.com/",
            authDomain: "aquavibes-4c90b.firebaseapp.com",
            projectId: "aquavibes-4c90b",
            storageBucket: "aquavibes-4c90b.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef1234567890"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Parâmetros
        const LIMITE_ONLINE = 30 * 1000;
        const LIMITE_24H = 24 * 60 * 60 * 1000;
        const LIMITE_MES = 30 * 24 * 60 * 60 * 1000;
        const INTERVALO_ATUALIZACAO = 10000;
        const DURACAO_SINO = 2000; // 2 segundos

        let snapshotAtual = null;
        let totalVisitas = 0;
        let dadosAnteriores = null; // Para detectar mudanças

        const somNotificacao = document.getElementById('somNotificacao');

        function tocarSino() {
            somNotificacao.currentTime = 0;
            somNotificacao.play().catch(e => console.log("Áudio bloqueado pelo navegador:", e));
            setTimeout(() => {
                somNotificacao.pause();
                somNotificacao.currentTime = 0;
            }, DURACAO_SINO);
        }

        function atualizarRelogio() {
            document.getElementById('horaAtualizacao').textContent = new Date().toLocaleTimeString('pt-BR');
        }

        function dadosMudaram(atual, anterior) {
            if (!anterior) return true;
            return JSON.stringify(atual) !== JSON.stringify(anterior);
        }

        function processarDados() {
            if (!snapshotAtual) return;
            const agora = Date.now();
            let totalCadastrados = 0;
            let totalOnline = 0;
            let adicionados24h = 0;
            let adicionadosMes = 0;
            const listaDispositivos = [];

            snapshotAtual.forEach(dispositivo => {
                const dados = dispositivo.val();
                const id = dispositivo.key;
                const mac = dados.mac || "Não informado";
                const ultimaAtualizacao = Number(dados?.status?.ultimaAtualizacao) || 0;
                const dataCadastro = Number(dados?.dataCadastro) || 0;
                const estaOnline = ultimaAtualizacao > 0 && (agora - ultimaAtualizacao) < LIMITE_ONLINE;

                totalCadastrados++;
                if (estaOnline) totalOnline++;
                if (dataCadastro > 0 && (agora - dataCadastro) < LIMITE_24H) adicionados24h++;
                if (dataCadastro > 0 && (agora - dataCadastro) < LIMITE_MES) adicionadosMes++;

                listaDispositivos.push({ id, mac, estaOnline });
            });

            const dadosAtuais = { totalCadastrados, totalOnline, adicionados24h, adicionadosMes, totalVisitas, listaDispositivos };

            // Toca o sino apenas quando houver mudança real
            if (dadosMudaram(dadosAtuais, dadosAnteriores)) {
                tocarSino();
                dadosAnteriores = dadosAtuais;
            }

            document.getElementById('totalCadastrados').textContent = totalCadastrados;
            document.getElementById('totalOnline').textContent = totalOnline;
            document.getElementById('adicionados24h').textContent = adicionados24h;
            document.getElementById('adicionadosMes').textContent = adicionadosMes;
            document.getElementById('totalVisitas').textContent = totalVisitas.toLocaleString('pt-BR');
            atualizarRelogio();

            const tabela = document.getElementById('tabelaDispositivos');
            tabela.innerHTML = "";
            if (listaDispositivos.length === 0) {
                tabela.innerHTML = `<tr><td colspan="3" class="p-5 text-center text-gray-500">Nenhum dispositivo cadastrado</td></tr>`;
                return;
            }

            listaDispositivos.sort((a, b) => a.id.localeCompare(b.id));
            listaDispositivos.forEach(disp => {
                const statusClasse = disp.estaOnline ? "bg-green-100 text-green-700 pulse" : "bg-red-100 text-red-700";
                const statusTexto = disp.estaOnline ? "Online" : "Offline";
                const linha = document.createElement("tr");
                linha.className = "hover:bg-gray-50 transition";
                linha.innerHTML = `
                    <td class="p-3 font-mono text-gray-700">${disp.id}</td>
                    <td class="p-3 font-mono text-gray-600">${disp.mac}</td>
                    <td class="p-3">
                        <span class="px-3 py-1 rounded-full text-xs font-medium ${statusClasse}">
                            ${statusTexto}
                        </span>
                    </td>
                `;
                tabela.appendChild(linha);
            });
        }

        function iniciarMonitoramento() {
            db.ref("dispositivos").on("value", snapshot => {
                snapshotAtual = snapshot;
                processarDados();
            });
            db.ref("estatisticas/visitas").on("value", snapshot => {
                totalVisitas = snapshot.val() || 0;
                processarDados();
            });
            setInterval(processarDados, INTERVALO_ATUALIZACAO);
        }

        window.onload = iniciarMonitoramento;
    </script>
</body>
</html>
